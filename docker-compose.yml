version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: colorectal-cancer-prediction:latest
    container_name: colorectal-cancer-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cancer-net

networks:
  cancer-net:
    driver: bridge
